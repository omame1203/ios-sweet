# SOURCE-ONLY candidate for edk2-porting/edk2-msm/configs/devices/dizi.conf.
# NOT buildable until Silicon/Qualcomm/sm7435 and Platform/Xiaomi/sm7435/dizi
# are implemented. In particular do NOT rename/copy the SDM845 or SM7325
# DXE binaries, ACPI or memory maps and declare them SM7435-compatible.
SOC_PLATFORM="SM7435"
VENDOR_NAME="Xiaomi"
PLATFORM_NAME="dizi"

# Matches POCO Pad's previously verified fastboot-boot GKI-v4 transport.
# This is not a signed UEFI payload nor a flashable installer.
BOOTIMG_HEADER_VERSION=4

# Deliberately omit OS version / patch level, which must be selected by
# the eventual verified firmware packaging flow; no fake OEM metadata.
# No SPLIT_DSDT/USE_IASL claims: an actual SM7435 ACPI port does not exist.
