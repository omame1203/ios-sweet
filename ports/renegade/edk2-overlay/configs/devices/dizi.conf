# Overlay candidate for edk2-porting/edk2-msm/configs/devices/dizi.conf.
# POCO Pad 2405CPCFBG, Qualcomm SM7435P/Parrot QRD, codename dizi.
# Genuine source-only Silicon/Qualcomm/sm7435 and
# Platform/Xiaomi/sm7435/dizi DSC/FDF now exist; the AArch64 DXE and a 4 MiB
# firmware FD have been compiled in an isolated public-source staging tree.
# No safe BootShim Linux Image handoff, ACPI/DMA ownership, executable RAM
# grant, boot-time GIC/GOP services or actual UEFI device boot are verified.
SOC_PLATFORM="SM7435"
SOC_VENDOR="Qualcomm"
VENDOR_NAME="Xiaomi"
PLATFORM_NAME="dizi"

# Previously verified dizi bootloader transport uses Android GKI boot header
# v4. This does not mean an FD itself can be used as the boot kernel.
BOOTIMG_HEADER_VERSION=4

# Deliberately do NOT borrow other Xiaomi device firmware patch levels,
# the SDM845/SM7325 memory map, SPLIT_DSDT, or default FD loading addresses.
