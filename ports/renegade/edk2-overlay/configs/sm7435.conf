# Overlay candidate for edk2-porting/edk2-msm/configs/sm7435.conf.
# Qualcomm SM7435/Parrot dizi has NO verified EDK2 silicon backend in the
# audited upstream checkout on 2026-10-21. Do not inherit SDM845/SM7325's
# FD_BASE=0xCE000000 or its FD_SIZE=0x02000000: these are other SoCs' maps.
# dizi's Linux kernel RAM window 0x8c0000000+0xb0000000 is not independently
# proven exclusive UEFI FD ownership, let alone an executable SEC entry.
#
# Upstream build.sh sources this config before building BootShim, then expects
# Silicon/Qualcomm/sm7435 and Platform/Xiaomi/sm7435/dizi.dsc. Explicitly
# terminate through its _error helper while both real platform and audited
# memory/entry properties remain unknown. There is no working FD_BASE/FD_SIZE.

SOC_VENDOR="Qualcomm"
if [ ! -f "${ROOTDIR}/Silicon/Qualcomm/sm7435/Library/PlatformPrePiLib/PlatformPrePiLib.inf" ] ||
   [ ! -f "${ROOTDIR}/Platform/Xiaomi/sm7435/dizi.dsc" ] ||
   [ ! -f "${ROOTDIR}/Platform/Qualcomm/sm7435/sm7435.fdf" ]; then
    if command -v _error >/dev/null 2>&1; then
        _error "SM7435 dizi EDK2 silicon/platform and FD entry/memory map are unimplemented"
    else
        printf '%s\n' "SM7435 dizi EDK2 silicon/platform and FD entry/memory map are unimplemented" >&2
        return 1
    fi
fi

# Once actual SM7435 memory ownership is established, supply reviewed FD_BASE
# and FD_SIZE in a separately audited change alongside real DSC/FDF/BootShim.
# Missing values must cause the upstream build to fail, not select defaults.
if [ -z "${FD_BASE:-}" ] || [ -z "${FD_SIZE:-}" ]; then
    if command -v _error >/dev/null 2>&1; then
        _error "SM7435 FD_BASE/FD_SIZE unknown; cannot generate UEFI FD"
    else
        printf '%s\n' "SM7435 FD_BASE/FD_SIZE unknown; cannot generate UEFI FD" >&2
        return 1
    fi
fi
